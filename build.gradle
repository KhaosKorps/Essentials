plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.11'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    // ✅ Skip publishing entirely for internal provider modules
    if (project.path.startsWith(":providers")) {
        project.logger.lifecycle("Skipping publish setup for ${project.name}")
        return
    }

    // ✅ Configure publishing for public modules (e.g., EssentialsX, Spawn, etc.)
    publishing {
        publications {
            create("gpr", MavenPublication) {
                from components.findByName("java")
                groupId = "com.khaoskorps.minecraft.essentials"
                artifactId = project.name
                version = rootProject.version

                pom {
                    name.set(project.name)
                    description.set("EssentialsX submodule: ${project.name}")
                    url.set("https://github.com/KhaosKorps/Essentials")

                    // 🚫 Strip internal project dependencies from generated POM
                    withXml {
                        def deps = asNode().dependencies
                        deps?.dependency?.removeAll { dep ->
                            def aid = dep.artifactId.text()
                            aid == "BaseProviders" ||
                                    aid == "PaperProvider" ||
                                    aid == "NMSReflectionProvider" ||
                                    aid == "1_8Provider" ||
                                    aid == "1_12Provider"
                        }
                    }
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

