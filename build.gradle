plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.14'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * ✅ Publishing configuration:
 * - Only provider subprojects are published
 * - Force-disable Gradle’s automatic 'maven' publication creation
 * - Adds only our 'gpr' publication for GitHub
 */
subprojects {
    apply plugin: 'java'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    // 🧱 Only apply publishing for providers
    if (project.path.startsWith(":providers")) {
        apply plugin: 'maven-publish'

        // 🧨 Stop Gradle from auto-creating "maven" publication completely
        tasks.withType(GenerateMavenPom).configureEach {
            if (name.toLowerCase().contains("maven")) {
                enabled = false
            }
        }

        // 🧹 After Gradle evaluates project, ensure only one publication exists
        afterEvaluate {
            extensions.configure(PublishingExtension) { pubExt ->
                pubExt.publications.configureEach { pub ->
                    if (pub.name == "maven") {
                        logger.lifecycle("Force removing 'maven' publication from ${project.name}")
                        pubExt.publications.remove(pub)
                    }
                }

                // ✅ Our clean GPR publication
                pubExt.publications.create("gpr", MavenPublication) {
                    from components.findByName("java")
                    groupId = "com.khaoskorps.minecraft.essentials"
                    artifactId = project.name.toLowerCase()
                    version = rootProject.version

                    pom {
                        name.set(project.name)
                        description.set("EssentialsX provider module: ${project.name}")
                        url.set("https://github.com/KhaosKorps/Essentials")
                    }
                }

                pubExt.repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                        credentials {
                            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
            }
        }

        logger.lifecycle("Configured publishing for ${project.name}")
    } else {
        logger.lifecycle("Skipping ${project.name} (non-provider or Indra-based module)")
    }
}
