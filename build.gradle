plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.12'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * ✅ Safe way to disable Gradle’s default “maven” publication in Gradle 8+
 * Instead of removing it directly, we prevent it from being realized or used.
 */
gradle.projectsEvaluated {
    subprojects { sub ->
        sub.plugins.withId('maven-publish') {
            sub.extensions.configure(PublishingExtension) { pubExt ->
                pubExt.publications.matching { it.name == "maven" }.all {
                    sub.logger.lifecycle("Disabling default Maven publication for ${sub.name}")
                    it.artifactId = "" // effectively neuter the default
                }
            }
        }
    }
}

/**
 * Configure actual custom publication for all subprojects
 */
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    publishing {
        publications {
            create("gpr", MavenPublication) {
                from components.findByName("java")
                groupId = "com.khaoskorps.minecraft.essentials"
                artifactId = project.name.toLowerCase() // ensure lowercase for GitHub
                version = rootProject.version

                pom {
                    name.set(project.name)
                    description.set("EssentialsX submodule: ${project.name}")
                    url.set("https://github.com/KhaosKorps/Essentials")
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
