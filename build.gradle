plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.3' // ✅ set global version for all modules

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = rootProject.version

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    // 🚫 Remove any default "maven" publications Gradle auto-created
    afterEvaluate {
        publishing {
            publications.removeIf { it.name.toLowerCase().contains("maven") && it.name != "gpr" }

            publications.create("gpr", MavenPublication) {
                from(components.findByName("java") ?: components.findByName("shadow"))
                artifactId = project.name.toLowerCase()
                groupId = group
                version = version

                pom {
                    name.set("EssentialsX Fork - ${project.name}")
                    description.set("Custom module ${project.name} of EssentialsX Fork")
                }
            }

            repositories {
                maven {
                    name = "GitHubPackages"
                    url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                    credentials {
                        username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                        password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                    }
                }
            }
        }
    }
}

