plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.12'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * Remove Gradle’s auto-created “maven” publication from all subprojects.
 * This avoids duplicate coordinate conflicts (e.g., BaseProviders vs baseproviders).
 */
subprojects {
    afterEvaluate {
        if (plugins.hasPlugin('maven-publish')) {
            publishing {
                publications.configureEach {
                    if (it.name == "maven") {
                        project.logger.lifecycle("Removing default Maven publication from ${project.name}")
                        publications.remove(it)
                    }
                }
            }
        }
    }
}

/**
 * Configure publishing for every module (providers and EssentialsX variants).
 */
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    publishing {
        publications {
            create("gpr", MavenPublication) {
                from components.findByName("java")
                groupId = "com.khaoskorps.minecraft.essentials"
                artifactId = project.name.toLowerCase()  // enforce lowercase for GitHub Packages
                version = rootProject.version

                pom {
                    name.set(project.name)
                    description.set("EssentialsX submodule: ${project.name}")
                    url.set("https://github.com/KhaosKorps/Essentials")
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
