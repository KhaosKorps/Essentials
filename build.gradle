plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
//def gitHash = 'git rev-parse --short HEAD'.execute().text.trim()
version = "1.0.11"//-${gitHash}" // ✅ set global version for all modules

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

subprojects {
    apply plugin: 'maven-publish'
    apply plugin: 'java'

    // Disable Gradle's automatic 'maven' publication
    publishing {
        // Prevent the default publication from being created
        tasks.withType(GenerateMavenPom).configureEach { onlyIf { it.name.contains("gpr") } }
    }

    // Alternatively, fully override default publications
    afterEvaluate {
        publishing {
            publications.configureEach {
                if (it.name == "maven") {
                    // remove or disable Gradle’s auto one
                    project.logger.lifecycle("Removing default Maven publication from ${project.name}")
                    publishing.publications.remove(it)
                }
            }
        }
    }

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    publishing {
        publications {
            gpr(MavenPublication) {
                groupId = 'com.khaoskorps.minecraft.essentials'
                artifactId = project.name
                version = '1.0.10'
                from components.findByName('java')

                pom {
                    name.set(project.name)
                    description.set("EssentialsX submodule: ${project.name}")
                    url.set('https://github.com/KhaosKorps/Essentials')
                }
            }
        }

        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/KhaosKorps/Essentials')
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
}



