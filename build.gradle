plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.13'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * 🔒 Prevent Gradle’s automatic “maven” publication from ever being created.
 * This must be applied safely before subproject publication configuration.
 */
gradle.beforeProject { proj ->
    proj.pluginManager.withPlugin('maven-publish') {
        proj.afterEvaluate {
            def pubExt = proj.extensions.findByType(PublishingExtension)
            if (pubExt != null) {
                pubExt.publications.matching { it.name == "maven" }.all { pub ->
                    proj.logger.lifecycle("Removing auto-created Maven publication from ${proj.name}")
                    pubExt.publications.remove(pub)
                }
            }
        }
    }
}

/**
 * ✅ Configure the *only* allowed publication ("gpr") for all modules
 */
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    publishing {
        publications {
            create("gpr", MavenPublication) {
                from components.findByName("java")
                groupId = "com.khaoskorps.minecraft.essentials"
                artifactId = project.name.toLowerCase() // required for GitHub
                version = rootProject.version

                pom {
                    name.set(project.name)
                    description.set("EssentialsX submodule: ${project.name}")
                    url.set("https://github.com/KhaosKorps/Essentials")
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
