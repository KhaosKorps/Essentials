plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
//def gitHash = 'git rev-parse --short HEAD'.execute().text.trim()
version = "1.0.10"//-${gitHash}" // ✅ set global version for all modules

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

subprojects {
    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    afterEvaluate {
        if (name in ["EssentialsX", "EssentialsXSpawn"]) {
            publishing {
                publications {
                    create("gpr", MavenPublication) {
                        groupId = "com.khaoskorps.minecraft.essentials"
                        artifactId = project.name.toLowerCase().replace("essentialsx", "essentialsx") // EssentialsX, EssentialsXSpawn, etc.
                        version = rootProject.version

                        from(components.findByName("java") ?: components.findByName("shadow"))

                        pom {
                            name.set("EssentialsX Fork - ${project.name}")
                            description.set("Custom EssentialsX fork module: ${project.name}")
                        }
                    }
                }
                repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                        credentials {
                            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
            }

        }
    }
}


