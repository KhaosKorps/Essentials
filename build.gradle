plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.3' // ✅ set global version for all modules

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

subprojects {
    // (plugins, group, etc.)
    afterEvaluate {
        // Only publish EssentialsX and EssentialsXSpawn
        if (name in ["EssentialsX", "EssentialsXSpawn"]) {
            publishing {
                publications {
                    create("gpr", MavenPublication) {
                        from(components.findByName("java") ?: components.findByName("shadow"))
                        groupId = "com.khaoskorps.minecraft.essentials"
                        artifactId = project.name.toLowerCase()
                        version = rootProject.version

                        pom {
                            name.set("EssentialsX Fork - ${project.name}")
                            description.set("Custom EssentialsX fork module: ${project.name}")
                        }
                    }
                }

                repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                        credentials {
                            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
            }
        }
    }
}

