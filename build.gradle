plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'

// 🔧 Auto-version using Git commit hash (e.g. 2.0.0-abc123)
def gitHash = "unknown"
try {
    def proc = "git rev-parse --short HEAD".execute(null, rootDir)
    proc.waitFor()
    gitHash = proc.in.text.trim()
} catch (ignored) {}
version = "2.0.0-${gitHash}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * ✅ Unified publishing config for all subprojects
 * Disables Indra’s default 'maven' publication and pushes only to GitHub Packages.
 */
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    // 🧹 Disable Indra’s auto 'maven' publication (if applied)
    plugins.withId("net.kyori.indra.publishing") {
        afterEvaluate {
            extensions.findByType(PublishingExtension)?.publications?.removeIf { it.name == "maven" }
        }
    }

    publishing {
        publications {
            create("gpr", MavenPublication) {
                from components.findByName("java")
                groupId = rootProject.group
                artifactId = project.name.toLowerCase()
                version = rootProject.version

                pom {
                    name.set(project.name)
                    description.set("EssentialsX module: ${project.name}")
                    url.set("https://github.com/KhaosKorps/Essentials")
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
