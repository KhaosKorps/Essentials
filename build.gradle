plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.13'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * 🔒 Remove Gradle’s default “maven” publication globally, even for nested provider subprojects.
 * This runs after all projects are evaluated and guarantees clean state.
 */
gradle.projectsEvaluated {
    allprojects { proj ->
        proj.plugins.withId('maven-publish') {
            def pubExt = proj.extensions.findByType(PublishingExtension)
            if (pubExt != null) {
                def toRemove = pubExt.publications.findAll { it.name == 'maven' }
                toRemove.each {
                    proj.logger.lifecycle("Force-removing default Maven publication from ${proj.name}")
                    pubExt.publications.remove(it)
                }
            }
        }
    }
}

/**
 * ✅ Configure unified publication for all subprojects (providers and EssentialsX modules)
 */
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    publishing {
        publications {
            create("gpr", MavenPublication) {
                from components.findByName("java")
                groupId = "com.khaoskorps.minecraft.essentials"
                artifactId = project.name.toLowerCase()
                version = rootProject.version

                pom {
                    name.set(project.name)
                    description.set("EssentialsX submodule: ${project.name}")
                    url.set("https://github.com/KhaosKorps/Essentials")
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
