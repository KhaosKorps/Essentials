plugins {
    id 'java-library'
    id 'maven-publish'
}

allprojects {
    plugins.withType(MavenPublishPlugin) {
        // Fully clear out any auto-created Maven publications before Gradle can use them
        afterEvaluate {
            def pubs = publishing.publications
            def toRemove = pubs.findAll { it.name.equalsIgnoreCase("maven") }
            if (!toRemove.isEmpty()) {
                toRemove.each { pubs.remove(it) }
                println "💣 Removed default 'maven' publication from ${project.name}"
            }
        }
    }
}

group = 'com.khaoskorps.minecraft.essentials'
def gitHash = 'git rev-parse --short HEAD'.execute().text.trim()
version = "1.0.8-${gitHash}" // ✅ set global version for all modules

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

subprojects {
    // Remove any default Maven publication Gradle auto-creates
    plugins.withType(MavenPublishPlugin) {
        publishing {
            publications.removeIf { it.name.equalsIgnoreCase("maven") }
        }
    }

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    afterEvaluate {
        if (plugins.hasPlugin('maven-publish')) {
            def pubContainer = publishing.publications
            def toRemove = pubContainer.findByName("maven")
            if (toRemove != null) {
                pubContainer.remove(toRemove)
                println("Removed default 'maven' publication from ${project.name}")
            }
        }

        if (name in ["EssentialsX", "EssentialsXSpawn"]) {
            publishing {
                publications {
                    create("gpr", MavenPublication) {
                        from(components.findByName("java") ?: components.findByName("shadow"))
                        groupId = "com.khaoskorps.minecraft.essentials"
                        artifactId = project.name.toLowerCase()
                        version = rootProject.version

                        pom {
                            name.set("EssentialsX Fork - ${project.name}")
                            description.set("Custom EssentialsX fork module: ${project.name}")
                        }
                    }
                }
                repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                        credentials {
                            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
            }
        }
    }
}


