plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.17' // bump this to avoid 409s

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * ✅ Configure unified publication for all subprojects (providers + Essentials modules)
 * Compatible with Indra (net.kyori.indra.publishing)
 */
subprojects {
    apply plugin: 'java'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    // Skip logic build and others that don't produce JARs
    if (project.name == "build-logic") {
        logger.lifecycle("⏭️ Skipping build-logic")
        return
    }

    plugins.withId("net.kyori.indra.publishing") {
        logger.lifecycle("⚠️ Disabling Indra's default Maven publication in ${project.name}")
        afterEvaluate {
            // Remove the auto-created maven publication if present
            project.extensions.configure(PublishingExtension) { pubExt ->
                pubExt.publications.removeIf { it.name == "maven" }
            }
        }
    }

    apply plugin: 'maven-publish'

    publishing {
        publications {
            register("gpr", MavenPublication) {
                from components.findByName("java")
                groupId = "com.khaoskorps.minecraft.essentials"
                artifactId = project.name.toLowerCase()
                version = rootProject.version

                pom {
                    name.set(project.name)
                    description.set("EssentialsX module: ${project.name}")
                    url.set("https://github.com/KhaosKorps/Essentials")
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
