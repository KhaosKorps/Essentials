plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.khaoskorps.minecraft.essentials'
version = '1.0.14'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * ✅ Clean publishing setup:
 * - Only publishes provider subprojects
 * - Removes Gradle’s default "maven" publication before defining ours
 */
subprojects {
    apply plugin: 'java'

    tasks.withType(Checkstyle).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }

    if (project.path.startsWith(":providers")) {
        apply plugin: 'maven-publish'

        afterEvaluate {
            // 🧹 Remove Gradle's auto-created 'maven' publication
            def pubExt = extensions.findByType(PublishingExtension)
            if (pubExt != null) {
                pubExt.publications.matching { it.name == "maven" }.all { pub ->
                    logger.lifecycle("💣 Removing default 'maven' publication from ${project.name}")
                    pubExt.publications.remove(pub)
                }
            }

            // ✅ Add your GitHub Packages publication
            publishing {
                publications {
                    create("gpr", MavenPublication) {
                        from components.findByName("java")
                        groupId = "com.khaoskorps.minecraft.essentials"
                        artifactId = project.name.toLowerCase()
                        version = rootProject.version

                        pom {
                            name.set(project.name)
                            description.set("EssentialsX provider module: ${project.name}")
                            url.set("https://github.com/KhaosKorps/Essentials")
                        }
                    }
                }

                repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/KhaosKorps/Essentials")
                        credentials {
                            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
            }
        }

        logger.lifecycle("📦 Configured publishing for ${project.name}")
    } else {
        logger.lifecycle("⏭️ Skipping ${project.name} (non-provider or Indra-based module)")
    }
}
